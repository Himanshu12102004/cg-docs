<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CG Docs – {pageTitle}</title>
    <meta name="description" content="{pageDescription}" />
    <meta name="keywords" content="{pageKeywords}" />
    <meta name="author" content="Himanshu Gupta" />

    <meta property="og:title" content="CG Docs – {pageTitle}" />
    <meta property="og:description" content="{pageDescription}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{pageUrl}" />
    <meta property="og:image" content="{cssAndJsFileLocation}assets/logo.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CG Docs – {pageTitle}" />
    <meta name="twitter:description" content="{pageDescription}" />
    <meta
      name="twitter:image"
      content="{cssAndJsFileLocation}assets/images/logo.svg"
    />

    <link rel="canonical" href="{pageUrl}" />

    <link rel="icon" href="{cssAndJsFileLocation}assets/images/logo.svg" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css"
    />
    <link id="hljs-theme" rel="stylesheet" />

    <link rel="stylesheet" href="{cssAndJsFileLocation}css/theming.css" />
    <link
      rel="stylesheet"
      href="{cssAndJsFileLocation}css/articleStyling.css"
    />
    <link rel="stylesheet" href="{cssAndJsFileLocation}css/mdStyling.css" />

    <!-- Structured Data (Schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TechArticle",
        "headline": "{pageTitle}",
        "description": "{pageDescription}",
        "author": {
          "@type": "Person",
          "name": "Himanshu Gupta"
        },
        "publisher": {
          "@type": "Organization",
          "name": "CG Docs"
        }
      }
    </script>
  </head>
  <body>
    <!-- Theme handling moved inside <body> to improve CLS -->
    <script>
      const root = document.documentElement;
      const hljsLink = document.getElementById("hljs-theme");

      let savedTheme = localStorage.getItem("theme");

      if (!savedTheme) {
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;

        savedTheme = prefersDark ? "dark" : "light";
        localStorage.setItem("theme", savedTheme);
      }

      if (savedTheme === "light") {
        root.classList.add("light");
        hljsLink.href =
          "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css";
      } else {
        hljsLink.href =
          "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css";
      }
    </script>

    <div class="overlay"></div>
    <nav>
      <div>
        <img
          class="logo"
          src="{cssAndJsFileLocation}assets/images/logo.svg"
          alt="logo"
        />
        <svg
          class="hamburgerMenu"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          fill="#000000"
          viewBox="0 0 256 256"

          <path
            d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"
          ></path>
        </svg>
      </div>
      <div class="searchBar">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 256 256"
          class="searchIcon"
        >
          <path
            d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"
          ></path>
        </svg>

        <input
          type="text"
          class="searchInput"
          placeholder="Search docs..."
          aria-label="Search docs"
        />
      </div>

        </a>
        <!-- Sun Icon -->
        <div class="theme-toggler">
          <svg
            class="sun theme-icon hide"
            stroke="currentColor"
            fill="currentColor"
            stroke-width="0"

          <!-- Moon Svg -->
          <svg
            class="moon theme-icon"
            stroke-width="0"
            viewBox="0 0 512 512"
            xmlns="http://www.w3.org/2000/svg"
          >

        </div>
      </div>
    </nav>
    <main class="layout">
      <aside class="layout__sidebar">{sidebar}</aside>

      <section class="layout__content">
        <div class="whereAmI">{Where Am I}</div>
        {content}
        <div class="nextPrev">
          <i>
            <a href="{prevPage}">
              <span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="32"
                  height="32"
                  fill="#000000"
                  viewBox="0 0 256 256"
                >
                  <path
                    d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"
                  ></path>
                </svg>
              </span>
              <span style="padding-bottom: 4px"> Previous </span>
            </a>
          </i>
          <i>
            <a href="{nextPage}">
              <span style="padding-bottom: 4px"> Next </span>
              <span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="32"
                  height="32"
                  fill="#000000"
                  viewBox="0 0 256 256"
                >
                  <path
                    d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"
                  ></path>
                </svg>
              </span>
            </a>
          </i>
        </div>
      </section>
    </main>

    <script src="{cssAndJsFileLocation}mdScript.js"></script>
  </body>
</html>
